[package]
name = "ntfs-search"
version = "0.22.0"
description = "NTFS 文件搜索"
edition = "2021"

[build-dependencies]
tauri-build = "2"

[dependencies]
base64 = "0.23"
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
